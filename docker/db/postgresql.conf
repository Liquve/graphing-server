# Этот файл оставлен как справка для ручного запуска PostgreSQL.
# Docker Compose передаёт эти параметры через `postgres -c ...`, чтобы сохранить
# стандартный postgresql.conf, который официальный postgres image создаёт в PGDATA.
listen_addresses = '*'
shared_preload_libraries = 'pg_cron'
cron.use_background_workers = on
