services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    image: graphing-server-db:local
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.use_background_workers=on
      - -c
      - cron.database_name=${APP_DB_NAME:-calc_db}
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-calc_db}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_password}
      APP_DB_NAME: ${APP_DB_NAME:-calc_db}
      APP_DB_USER: ${APP_DB_USER:-calc_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-calc_app_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphing-server:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${APP_DB_NAME:-calc_db}
      DB_USER: ${APP_DB_USER:-calc_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:-calc_app_password}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      MAIL_SERVICE_BASE_URL: ${MAIL_SERVICE_BASE_URL:-http://host.docker.internal:8025}
      MAIL_SERVICE_FROM_USER: ${MAIL_SERVICE_FROM_USER:-admin}
      MAIL_SERVICE_SENDER_ALIAS: ${MAIL_SERVICE_SENDER_ALIAS:-Graphing Server}
      GRAPHING_CALCULATION_POINTS: ${GRAPHING_CALCULATION_POINTS:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:${SERVER_PORT:-13579}:13579"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/13579'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
